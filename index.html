<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forecaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fira+Code:wght@400;500&family=Instrument+Serif&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
<style>
  :root {
    --font-sans: "Archivo", "Noto Sans SC", system-ui, sans-serif;
    --font-mono: "Fira Code", ui-monospace, Menlo, monospace;
    --brand-font: "Instrument Serif", serif;
    --paper: oklch(0 0 0);
    --paper-2: oklch(0.16 0 0);
    --ink: oklch(0.98 0 0);
    --muted: oklch(0.70 0 0);
    --faint: oklch(0.48 0 0);
    --line: oklch(0.30 0 0);
    --line-soft: oklch(0.20 0 0);
    --accent: oklch(0.87 0.19 99);
    --nav-w: 14rem;
    --site-column-gap: 4rem;
    --site-pad-top: 2.8rem;
    --brand-size: 3.1rem;
    --brand-line-gap: 0;
    --brand-to-nav: 1.3rem;
    --nav-size: 1.84rem;
    --nav-row-gap: 0.48rem;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 17px;
    line-height: 1.5;
    letter-spacing: -0.012em;
    -webkit-font-smoothing: antialiased;
  }
  main { margin: 0; }
  figure { margin: 0; }
  .site {
    display: grid;
    grid-template-columns: var(--nav-w) minmax(0, 1fr);
    column-gap: var(--site-column-gap);
    width: min(1120px, calc(100% - 4rem));
    margin: 0 auto;
    padding: var(--site-pad-top) 0 5rem;
  }
  .sidebar {
    position: sticky;
    top: var(--site-pad-top);
    z-index: 1;
    align-self: start;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: var(--nav-w);
  }
  .brand {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--brand-line-gap);
    margin: 0 0 var(--brand-to-nav);
    color: var(--ink);
    font-family: var(--brand-font);
    font-size: var(--brand-size);
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.015em;
  }
  .brand-line,
  .nav-item {
    text-box-trim: trim-both;
    text-box-edge: cap alphabetic;
  }
  .nav {
    display: flex;
    flex-direction: column;
    gap: var(--nav-row-gap);
    align-items: flex-start;
  }
  .nav-item {
    margin: 0;
    padding: 0;
    border: 0;
    background: none;
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: var(--nav-size);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.05em;
    text-transform: lowercase;
    text-decoration-thickness: 3px;
    cursor: pointer;
  }
  .nav-item:hover {
    text-decoration: line-through;
    text-decoration-color: var(--accent);
    text-decoration-thickness: 3px;
  }
  .nav-item.active { color: var(--accent); }
  .nav-item.active:hover { text-decoration: none; }
  .page { min-width: 0; }
  .charts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem 2.5rem;
    align-items: start;
  }
  .chart { min-width: 0; }
  .charts[hidden] { display: none; }
  .wide { grid-column: 1 / -1; }
  .head .k { display: block; font-size: 0.95rem; }
  .head .v {
    display: block;
    margin-top: 0.15rem;
    font-size: 1.85rem;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
    line-height: 1.15;
  }
  .head .s { display: block; margin-top: 0.3rem; color: var(--muted); font-size: 0.92rem; }
  .v .unit {
    margin-left: 0.35rem;
    font-size: 0.95rem;
    letter-spacing: 0;
    color: var(--muted);
  }
  .plot { width: 100%; height: 240px; margin-top: 0.35rem; }
  .plot.short { height: 184px; }
  .note { margin: 0; color: var(--muted); font-size: 0.92rem; }
  .empty { display: grid; gap: 1rem; }
  .slot {
    display: grid;
    grid-template-columns: 8rem 1fr auto;
    gap: 0.75rem 1rem;
    align-items: center;
  }
  .slot .blank { border-bottom: 1px solid var(--line); height: 0; }
  .slot .s { color: var(--muted); font-size: 0.92rem; white-space: nowrap; }
  @media (max-width: 860px) {
    .site {
      grid-template-columns: 1fr;
      width: auto;
      padding: 1.6rem 1.25rem 4rem;
    }
    .sidebar {
      position: static;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--line);
    }
    .brand { font-size: 2.1rem; }
    .nav-item { font-size: 1.85rem; }
  }
  @media (max-width: 760px) {
    .charts { grid-template-columns: 1fr; }
    .slot { grid-template-columns: 1fr; }
    .slot .blank { display: none; }
    .slot .s { white-space: normal; }
  }
</style>
</head>
<body>
<div class="site">
  <header class="sidebar">
    <div class="brand"><span class="brand-line">Fore</span><span class="brand-line">caster</span></div>
    <nav class="nav" aria-label="按更新节奏看">
      <button type="button" class="nav-item active" id="tab-daily" aria-controls="panel-daily">daily</button>
      <button type="button" class="nav-item" id="tab-quarter" aria-controls="panel-quarter">quarterly</button>
    </nav>
  </header>
  <main class="page">
  <div id="panel-daily" class="charts">
      <figure class="chart">
        <div class="head">
          <span class="k">10 年期美债收益率</span>
          <span class="v"><span id="dgs-now"></span><span class="unit">%</span></span>
        </div>
        <div id="dgs" class="plot"></div>
      </figure>
      <figure class="chart">
        <div class="head">
          <span class="k">布伦特油价</span>
          <span class="v"><span id="brent-now"></span><span class="unit">美元/桶</span></span>
        </div>
        <div id="brent" class="plot"></div>
      </figure>
      <figure class="chart">
        <div class="head">
          <span class="k">投资级利差</span>
          <span class="v"><span id="oas-now"></span><span class="unit">百分点</span></span>
          <span class="s">评级较好的公司债，比同年限国债贵出来的幅度。数字变大，是市场觉得这些公司更可能还不了钱。</span>
        </div>
        <div id="oas" class="plot"></div>
      </figure>
      <div class="wide empty">
        <div class="slot">
          <span class="k">GPU 租金</span>
          <span class="blank" aria-hidden="true"></span>
          <span class="s">没有可公开转载的日频</span>
        </div>
        <div class="slot">
          <span class="k">云厂商利差</span>
          <span class="blank" aria-hidden="true"></span>
          <span class="s">单个公司的利差要付费行情</span>
        </div>
      </div>
      <p class="note wide" id="daily-note">美债、油价和利差，用的是圣路易斯联储公布的行情。</p>
  </div>

  <div id="panel-quarter" class="charts" hidden>
      <figure class="chart">
        <div class="head">
          <span class="k">微软</span>
          <span class="v"><span id="msft-now"></span><span class="unit">亿美元</span></span>
          <span class="s">商业业务已签、还没交付的合同金额。</span>
        </div>
        <div id="msft" class="plot short"></div>
      </figure>
      <figure class="chart">
        <div class="head">
          <span class="k">甲骨文</span>
          <span class="v"><span id="orcl-now"></span><span class="unit">亿美元</span></span>
          <span class="s">已签、还没交付的合同金额。</span>
        </div>
        <div id="orcl" class="plot short"></div>
      </figure>
      <figure class="chart">
        <div class="head">
          <span class="k">亚马逊</span>
          <span class="v"><span id="amzn-now"></span><span class="unit">亿美元</span></span>
          <span class="s">期限一年以上、还没交付的合同承诺，主要是 AWS。</span>
        </div>
        <div id="amzn" class="plot short"></div>
      </figure>
      <figure class="chart">
        <div class="head">
          <span class="k">Alphabet</span>
          <span class="v"><span id="googl-now"></span><span class="unit">亿美元</span></span>
          <span class="s">已签、还没交付的合同金额，绝大部分是 Google Cloud。</span>
        </div>
        <div id="googl" class="plot short"></div>
      </figure>
      <figure class="chart">
        <div class="head">
          <span class="k">英伟达</span>
          <span class="v"><span id="nvda-now"></span><span class="unit">天</span></span>
          <span class="s">客户还欠的货款，折成多少天的当季收入。</span>
        </div>
        <div id="nvda" class="plot short"></div>
      </figure>
      <div class="wide empty">
        <div class="slot">
          <span class="k">取消的合同</span>
          <span class="blank" aria-hidden="true"></span>
          <span class="s">有报道说微软不再续租甲骨文算力，还没写进季报</span>
        </div>
      </div>
      <p class="note wide" id="quarter-note">合同金额和货款天数，按各公司向美国证监会提交的 10-Q 与 10-K 计算。</p>
  </div>
  </main>
</div>

const quiet = "#a3a3a3";
const ink = "#f7f7f7";
const grid = "#2a2a2a";
const accent = "#ECD32D";
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function latest(rows) { return rows[rows.length - 1]; }

function formatNum(n) {
  return Math.abs(n) >= 1000 ? n.toLocaleString("en-US") : String(n);
}

function tidy(n) {
  const abs = Math.abs(n);
  const digits = abs >= 100 ? 0 : abs >= 10 ? 1 : 2;
  return String(Math.round(n * 10 ** digits) / 10 ** digits);
}

function formatWhen(raw) {
  if (Array.isArray(raw)) raw = raw[0];
  const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  let date;
  if (typeof raw === "string" && /^\d{4}-\d{2}-\d{2}/.test(raw)) {
    const parts = raw.slice(0, 10).split("-");
    date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  } else {
    date = new Date(raw);
  }
  if (Number.isNaN(date.getTime())) return String(raw);
  return new Intl.DateTimeFormat(undefined, {
    year: "numeric",
    month: "long",
    day: "numeric",
    timeZone: zone
  }).format(date);
}

const DAILY = DATA.daily;
const QUARTERLY = DATA.quarterly;

document.getElementById("dgs-now").textContent = formatNum(latest(DAILY.dgs)[1]);
document.getElementById("brent-now").textContent = formatNum(latest(DAILY.brent)[1]);
document.getElementById("oas-now").textContent = formatNum(latest(DAILY.oas)[1]);
document.getElementById("msft-now").textContent = formatNum(latest(QUARTERLY.msft)[1]);
document.getElementById("orcl-now").textContent = formatNum(latest(QUARTERLY.orcl)[1]);
document.getElementById("amzn-now").textContent = formatNum(latest(QUARTERLY.amzn)[1]);
document.getElementById("googl-now").textContent = formatNum(latest(QUARTERLY.googl)[1]);
document.getElementById("nvda-now").textContent = formatNum(latest(QUARTERLY.nvda)[1]);

const latestDailyDate = [latest(DAILY.dgs)[0], latest(DAILY.brent)[0], latest(DAILY.oas)[0]].sort().pop();
const dateParts = latestDailyDate.split("-");
document.getElementById("daily-note").textContent =
  "美债、油价和利差，用的是圣路易斯联储公布的行情，更新至 " +
  Number(dateParts[0]) + " 年 " + Number(dateParts[1]) + " 月 " + Number(dateParts[2]) + " 日。";

function niceAxis(lo, hi, targetSplits, minSpan) {
  const rawSpan = Math.max(hi - lo, minSpan || 0, 1e-6);
  const mid = (lo + hi) / 2;
  const paddedLo = Math.max(0, mid - rawSpan * 0.56);
  const paddedHi = mid + rawSpan * 0.56;
  const roughStep = (paddedHi - paddedLo) / targetSplits;
  const mag = Math.pow(10, Math.floor(Math.log10(roughStep)));
  const norm = roughStep / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 3 ? 3 : norm <= 5 ? 5 : 10) * mag;
  const min = Math.max(0, Math.floor(paddedLo / step) * step);
  const max = Math.ceil(paddedHi / step) * step;
  return {
    min: Number(min.toFixed(6)),
    max: Number(max.toFixed(6)),
    interval: Number(step.toFixed(6))
  };
}

function dailyOption(rows, unit) {
  const values = rows.map(function (row) { return row[1]; });
  const lo = Math.min.apply(null, values);
  const hi = Math.max.apply(null, values);
  const bounds = niceAxis(lo, hi, 4, 0);
  return {
    animation: !reduced,
    animationDuration: 400,
    grid: { left: 4, right: 8, top: 12, bottom: 28, containLabel: true },
    tooltip: {
      trigger: "axis",
      backgroundColor: "#1a1a1a",
      borderColor: "#3d3d3d",
      textStyle: { color: ink, fontSize: 13 },
      formatter: function (items) {
        const item = items[0];
        const when = formatWhen(item.data && item.data[0] != null ? item.data[0] : item.axisValue);
        return when + "<br>" + formatNum(item.data[1]) + " " + unit;
      }
    },
    xAxis: {
      type: "time",
      axisLine: { lineStyle: { color: "#3d3d3d" } },
      axisTick: { show: false },
      axisLabel: { color: quiet, fontSize: 11, hideOverlap: true },
      splitLine: { show: false }
    },
    yAxis: {
      type: "value",
      min: bounds.min,
      max: bounds.max,
      interval: bounds.interval,
      axisLabel: { color: quiet, fontSize: 11, formatter: tidy },
      splitLine: { lineStyle: { color: grid } }
    },
    series: [{
      type: "line",
      showSymbol: false,
      data: rows,
      lineStyle: { color: accent, width: 1.6 },
      itemStyle: { color: accent },
      areaStyle: { color: "rgba(236, 211, 45, 0.08)" }
    }]
  };
}

function stepOption(points, unit) {
  const values = points.map(function (p) { return p[1]; });
  const lo = Math.min.apply(null, values);
  const hi = Math.max.apply(null, values);
  const bounds = niceAxis(lo, hi, 3, hi * 0.16);
  return {
    animation: !reduced,
    animationDuration: 400,
    grid: { left: 4, right: 8, top: 14, bottom: 24, containLabel: true },
    tooltip: {
      trigger: "axis",
      backgroundColor: "#1a1a1a",
      borderColor: "#3d3d3d",
      textStyle: { color: ink, fontSize: 13 },
      formatter: function (items) {
        const item = items[0];
        return formatWhen(item.axisValue) + "<br>" + formatNum(item.data) + " " + unit;
      }
    },
    xAxis: {
      type: "category",
      data: points.map(function (p) { return p[0]; }),
      axisLine: { lineStyle: { color: "#3d3d3d" } },
      axisTick: { show: false },
      axisLabel: {
        color: quiet,
        fontSize: 11,
        hideOverlap: true,
        formatter: function (v) {
          return typeof v === "string" && v.length >= 7 ? v.slice(2, 7).replace("-", "/") : v;
        }
      }
    },
    yAxis: {
      type: "value",
      min: bounds.min,
      max: bounds.max,
      interval: bounds.interval,
      axisLabel: { color: quiet, fontSize: 11, formatter: tidy },
      splitLine: { lineStyle: { color: grid } }
    },
    series: [{
      type: "line",
      data: values,
      symbol: "circle",
      symbolSize: 6,
      lineStyle: { color: accent, width: 1.6 },
      itemStyle: { color: accent },
      areaStyle: { color: "rgba(236, 211, 45, 0.08)" }
    }]
  };
}

const charts = [];
function mount(id, option) {
  const node = document.getElementById(id);
  const chart = echarts.init(node, null, { renderer: "canvas" });
  chart.setOption(option);
  charts.push(chart);
}

let quarterReady = false;

function resizeCharts() {
  charts.forEach(function (chart) { chart.resize(); });
}

function showQuarterCharts() {
  if (quarterReady) return;
  mount("msft", stepOption(QUARTERLY.msft, "亿美元"));
  mount("orcl", stepOption(QUARTERLY.orcl, "亿美元"));
  mount("amzn", stepOption(QUARTERLY.amzn, "亿美元"));
  mount("googl", stepOption(QUARTERLY.googl, "亿美元"));
  mount("nvda", stepOption(QUARTERLY.nvda, "天"));
  quarterReady = true;
}

function selectTab(name) {
  const daily = name === "daily";
  document.getElementById("panel-daily").hidden = !daily;
  document.getElementById("panel-quarter").hidden = daily;
  document.getElementById("tab-daily").classList.toggle("active", daily);
  document.getElementById("tab-quarter").classList.toggle("active", !daily);
  if (!daily) showQuarterCharts();
  requestAnimationFrame(function () { requestAnimationFrame(resizeCharts); });
}

document.getElementById("tab-daily").addEventListener("click", function () { selectTab("daily"); });
document.getElementById("tab-quarter").addEventListener("click", function () { selectTab("quarter"); });

mount("dgs", dailyOption(DAILY.dgs, "%"));
mount("brent", dailyOption(DAILY.brent, "美元/桶"));
mount("oas", dailyOption(DAILY.oas, "百分点"));

window.addEventListener("resize", resizeCharts);
if (location.hash === "#quarter") selectTab("quarter");
</script>
